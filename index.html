<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Outlook</title>

  <script>
    function openOutlook() {

      // Android Intent with browser fallback
      window.location.href =
        "intent://mail/#Intent;" +
        "scheme=https;" +
        "package=com.microsoft.office.outlook;" +
        "S.browser_fallback_url=https://outlook.office.com/mail/;" +
        "end;";
    }
  </script>
</head>

<body>

<button onclick="openOutlook()">Open Outlook</button>

</body>
</html>
