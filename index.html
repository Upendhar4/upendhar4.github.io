<!DOCTYPE html>
<html>
<head>
    <title>Outlook Link</title>
</head>
<body>

<h3>Open Outlook</h3>

<a href="https://outlook.office.com/mail/">Open Outlook app</a>

<a href="intent://mail/#Intent;
scheme=https;
package=com.microsoft.office.outlook;
end;"
onclick="setTimeout(function () {
    window.location.href='https://outlook.office.com/mail/';
}, 700);">
Open Outlook
</a>

</body>
</html>
