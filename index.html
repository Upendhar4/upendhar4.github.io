<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Outlook</title>

  <script>
    function openOutlook() {
      // Android Intent with browser fallback (NO Play Store)
      window.location.href =
        "intent://mail/#Intent;" +
        "scheme=https;" +
        "package=com.microsoft.office.outlook;" +
        "S.browser_fallback_url=https%3A%2F%2Foutlook.office.com%2Fmail%2F;" +
        "end;";
    }
  </script>
</head>
<body>

  <button onclick="openOutlook()"
          style="padding:12px 20px;font-size:16px;">
    Open Outlook
  </button>

</body>
</html>
